- section: "Interestingness, Open-Ended Learning, and Artificial Curiosity"
  projects:
    - title: "Interestingness as an Inductive Heuristic for Future Compression Progress"
      link: "/blog/interestingness_position/"
      image: "teaser/interestingness_position_paper_teaser.png"
      venue: "ICML 2026"
      paper: "https://arxiv.org/abs/2605.14831"
      description: "We provide a formal definition of interestingness, prove some intriguing properties, experimentally investigate it using exhaustive program search in various Turing-complete domains, and connect it to current machine learning approaches. Most importantly, we show that the metric predicting potential future compression progress best is \"stagnation length\": the gap since the last observed progress. The longer progress has stalled, the less likely future progress becomes."
    - title: "Measuring In-Context Computation Complexity via Hidden State Prediction"
      link: "/blog/hidden_state_prediction/"
      image: "teaser/ICML_2025_teaser.png"
      venue: "ICML 2025"
      paper: "https://arxiv.org/abs/2503.13431"
      description: "How can we determine whether an LLM is doing anything \"interesting\" at any given moment? Traditional loss only tells us if the next token can be accurately predicted. It says nothing about the computational effort required to predict it. We connect task complexity to the in-context program that the model must synthesize dynamically to solve a task, demonstrating that this can be estimated by measuring the predictability of future hidden states in a sequence model."
    - title: "Multiple Token Divergence: Measuring and Steering In-Context Computation Density"
      link: "/blog/multiple_token_divergence/"
      image: "teaser/multiple_token_divergence_teaser.png"
      venue: "ICLR 2026"
      paper: "https://arxiv.org/abs/2512.22944"
      description: "We utilize the multi-token prediction heads that many modern LLMs are trained with to measure exactly when additional computational effort alters outputs versus when a shallow shortcut module suffices. In contrast to hidden state prediction, Multiple Token Divergence operates directly at the logit level. This enables real-time model steering during generation: by extrapolating away from the shortcut distribution, we can encourage counter-intuitive tokens that only make sense with deeper computation, enhancing creative capabilities."
    - title: "Learning One Abstract Bit at a Time Through Self-Invented Experiments Encoded as Neural Networks"
      link: "/blog/abstract_exeriments/"
      image: "teaser/abstract_experiments.jpg"
      venue: "IWAI 2023 (Oral)"
      paper: "https://arxiv.org/abs/2212.14374"
      description: "Agents that explore the world in an open-ended way and act as artificial scientists must learn how to formulate insightful questions. We present a novel framework for this: most scientific problems can be framed as binary questions of the form, *\"If I perform this exact experiment, will I get this exact outcome?\"* Due to the computational universality of RNNs, any such question can be encoded within their weights. We implement a proof of concept where a controller module continuously generates such questions and verifies the answers within the environment, receiving rewards for questions that yield high information gain."

- section: "Understanding and Generating Neural Networks at the Weights Level"
  projects:
    - title: "Learning Useful Representations of Recurrent Neural Network Weight Matrices"
      link: "/blog/rnn_representations/"
      image: "teaser/rnn_representations.jpg"
      venue: "ICML 2024 (Oral)"
      paper: "https://proceedings.mlr.press/v235/herrmann24a.html"
      description: "RNNs are Turing complete, meaning their weights can theoretically represent any computable function. We investigate different ways of how a weight-encoder can extract various aspects about what exactly an RNN does, given only its weights. We find that our novel \"interactive probing\" method drastically outperforms mechanistic approaches: instead of looking directly at the weights, our functionalist approach successfully learns to interrogate the behavior of the network they define."
    - title: "Goal-Conditioned Generators of Deep Policies"
      link: "/blog/gogepo/"
      image: "teaser/gogepo.jpg"
      venue: "AAAI 2023 (Oral)"
      paper: "https://ojs.aaai.org/index.php/AAAI/article/view/25912"
      description: "Using probing techniques, we can evaluate the exact degree to which a policy achieves a specified goal in an environment. In this work, we take this a step further by generating policy weights conditioned directly on a target goal. By backpropagating through the policy evaluator, we can train this weight generator efficiently. This forms the basis of a novel RL algorithm: by iteratively requesting policies that perform marginally better than those already generated, we directionally explore the parameter space to obtain high-performing policies."
    - title: "Sonifying and Visualizing How Music Sounds to an Artificial Ear"
      link: "/blog/immersions/"
      image: "immersions/teaser.jpg"
      venue: "PMLR 2020, NeurIPS 2019 Best Demonstration Award"
      paper: "/assets/pdfs/Immersions_NeurIPS.pdf"
      description: "This project is an audio-visual study of the inner workings of sound-processing neural networks. How do internal activations react to different acoustic properties? To which kinds of sounds does a given layer or individual neuron respond? We present a real-time tool that answers these questions, allowing users to select specific neurons and synthesize the exact audio that triggers them via gradient descent."

- section: "Creativity, Music, and Narratives"
  projects:
    - title: "On the Distillation of Stories for Transferring Narrative Arcs in Collections of Independent Media"
      link: "/blog/narrative_essence/"
      image: "teaser/narrative_essence.jpg"
      venue: "IEEE TPAMI"
      paper: "https://ieeexplore.ieee.org/document/10734853"
      description: "Many works of art aim to tell a story. We introduce the concept of \"narrative information\": the aspect of a narrative \"atom\" in a story that best predicts its structural placement within the whole. We propose a concrete method to distill an atom down to a low-dimensional \"narrative essence.\" Using music albums as a case study, we identify prototypical narrative arcs and introduce an algorithm to automatically rearrange an arbitrary set of tracks to conform to a specific narrative trajectory."
    - title: "Automatic Album Sequencing"
      link: null
      image: "teaser/album_sequencing.jpg"
      venue: "ISMIR 2024 Demos"
      paper: "https://arxiv.org/abs/2411.07772"
      description: "When listening to music playlists, users are typically limited two options: the pre-defined order, or a randomly shuffled one. We present a tool that automatically sequences an arbitrary collection of tracks into multiple coherent orders. The underlying model was trained on many thousands of music albums, successfully extracting the latent structural patterns human producers use when arranging tracks."
    - title: "Generative Transformer-based Models of Symbolic Polyphonic Music"
      link: "/blog/master_thesis/"
      image: "teaser/master_thesis.jpg"
      venue: "Research Project"
      paper: "/assets/pdfs/mami_thesis.pdf"
      description: "In this work, we investigate several core challenges of symbolic, MIDI-like music generation. We propose a novel command-based tokenization scheme, augmentations for input representations, and targeted modifications to the relative attention mechanism. Additionally, we present a discrete representation-learning architecture that yields downsampled sequences, which can be easily generated by a dedicated model and subsequently upsampled using a learned decoder."
